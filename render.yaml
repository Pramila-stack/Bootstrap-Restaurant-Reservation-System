services:
  - type: web
    name: maison-rouge
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn RESTAURANT.wsgi:application"
    plan: free

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com localhost 127.0.0.1"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: maison-rouge-db
          property: connectionString

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: maison-rouge-db
    plan: free
    databaseName: maisonrouge
    user: maisonrouge
